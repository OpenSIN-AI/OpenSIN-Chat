name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  YARN_VERSION: "1.22.22"

jobs:
  quality:
    name: Lint, types, tests, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Activate package manager
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          yarn --version

      - name: Install monorepo dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Enforce repository architecture and policy
        run: |
          yarn check:layout
          yarn check:branding
          yarn check:spdx

      - name: Validate repository maintenance scripts
        run: |
          node --check tooling/scripts/enable-multi-user.cjs
          node --test tooling/scripts/*.test.cjs
          bash -n tooling/scripts/deploy-production.sh
          bash -n tooling/scripts/generate-auth-token.sh
          bash -n platform/containers/image/docker-entrypoint.sh
          bash -n platform/containers/image/docker-healthcheck.sh

      - name: Validate Docker Compose
        run: |
          cp platform/containers/compose/.env.example platform/containers/compose/.env
          docker compose \
            -f platform/containers/compose/docker-compose.yml \
            -f platform/containers/compose/docker-compose.production.yml \
            config >/dev/null

      - name: Lint all applications
        run: yarn lint:ci

      - name: Type-check applications
        run: yarn type-check

      - name: Verify translations and bundle graph
        run: |
          yarn verify:translations
          yarn workspace opensin-chat-frontend check:bundle

      - name: Check API dependency cycles
        run: yarn workspace opensin-chat-server check:circular

      - name: Run unit and integration tests
        run: yarn test

      - name: Enforce coverage thresholds
        run: yarn test:coverage

      - name: Build production frontend and Prisma client
        run: yarn build

  container:
    name: Production image and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        run: |
          docker buildx build \
            --load \
            --file platform/containers/image/Dockerfile \
            --build-arg SKIP_CHROMIUM=1 \
            --tag opensin-chat:ci \
            .

      - name: Start production image
        run: |
          set -euo pipefail
          JWT_SECRET="$(openssl rand -hex 32)"
          SIG_KEY="$(openssl rand -hex 32)"
          SIG_SALT="$(openssl rand -hex 32)"
          docker run -d \
            --name opensin-chat-ci \
            -p 38471:3001 \
            -e STORAGE_DIR=/app/server/storage \
            -e DATABASE_URL=file:/app/server/storage/opensin.db \
            -e JWT_SECRET="$JWT_SECRET" \
            -e SIG_KEY="$SIG_KEY" \
            -e SIG_SALT="$SIG_SALT" \
            opensin-chat:ci

      - name: Wait for full readiness
        run: |
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' opensin-chat-ci 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs opensin-chat-ci
              exit 1
            fi
            sleep 2
          done
          docker logs opensin-chat-ci
          exit 1

      - name: Verify API and document worker
        run: |
          curl --fail --silent http://127.0.0.1:38471/api/ping >/dev/null
          docker exec opensin-chat-ci curl --fail --silent http://127.0.0.1:8888/health >/dev/null

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install browser test dependencies
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          yarn install --frozen-lockfile --network-timeout 600000
          yarn --cwd apps/web playwright install --with-deps chromium

      - name: Run stateless browser smoke suite
        env:
          APP_URL: http://127.0.0.1:38471
        run: yarn test:e2e:smoke

      - name: Print container logs on failure
        if: failure()
        run: docker logs opensin-chat-ci || true
