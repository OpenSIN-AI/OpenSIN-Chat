name: "${COMPOSE_PROJECT_NAME:-opensin-chat}"

networks:
  opensin-chat:
    driver: bridge

services:
  fix-permissions:
    image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    container_name: "${FIX_PERMISSIONS_CONTAINER_NAME:-opensin-fix-perms}"
    user: root
    command: >
      sh -c "mkdir -p /storage/tmp /storage/models /storage/vector-cache /storage/lancedb /storage/documents /storage/assets /storage/generated-files /storage/generated-reports /storage/plugins /storage/push-notifications /collector-hotdir /collector-outputs && chown -R ${UID:-1000}:${GID:-1000} /storage /collector-hotdir /collector-outputs && echo 'Permissions fixed'"
    volumes:
      - "${API_STORAGE_HOST_PATH:-../../../apps/api/storage-opensin}:/storage:rw"
      - "${WORKER_HOTDIR_HOST_PATH:-../../../apps/worker/hotdir}:/collector-hotdir:rw"
      - "${WORKER_OUTPUTS_HOST_PATH:-../../../apps/worker/outputs}:/collector-outputs:rw"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  opensin-chat:
    image: "${OPENSIN_IMAGE_REPOSITORY:-opensin-chat}:${OPENSIN_IMAGE_TAG:-local}"
    container_name: "${COMPOSE_CONTAINER_NAME:-opensin-chat}"

    build:
      context: ../../..
      dockerfile: ./platform/containers/image/Dockerfile
      args:
        ARG_UID: "${UID:-1000}"
        ARG_GID: "${GID:-1000}"
        SKIP_CHROMIUM: "${SKIP_CHROMIUM:-1}"
        CHROMIUM_SHA256: "${CHROMIUM_SHA256:-}"
        CHROMIUM_DOWNLOAD_URL: "${CHROMIUM_DOWNLOAD_URL:-}"
        VITE_ENABLE_IMAGE_GENERATION: "${VITE_ENABLE_IMAGE_GENERATION:-false}"

    init: true
    restart: unless-stopped
    depends_on:
      fix-permissions:
        condition: service_completed_successfully

    user: "${UID:-1000}:${GID:-1000}"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_PORT:-43939}:3001"

    volumes:
      - "${API_STORAGE_HOST_PATH:-../../../apps/api/storage-opensin}:/app/server/storage:rw"
      - "${WORKER_HOTDIR_HOST_PATH:-../../../apps/worker/hotdir}:/app/collector/hotdir:rw"
      - "${WORKER_OUTPUTS_HOST_PATH:-../../../apps/worker/outputs}:/app/collector/outputs:rw"

    tmpfs:
      - "/tmp:size=256m,mode=1777"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      STORAGE_DIR: "${STORAGE_DIR:-/app/server/storage}"
      DATABASE_URL: "${DATABASE_URL:-file:/app/server/storage/opensin.db}"

      ENABLE_IMAGE_GENERATION: "${ENABLE_IMAGE_GENERATION:-false}"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3001/api/ping').then(r=>r.ok?r.json():Promise.reject(new Error('api:'+r.status))).then(d=>d.online===true||Promise.reject(new Error('api offline'))),fetch('http://127.0.0.1:8888/health').then(r=>r.ok?r.json():Promise.reject(new Error('worker:'+r.status))).then(d=>d.status==='ok'||Promise.reject(new Error('worker offline')))]).then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

    networks:
      - opensin-chat

    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
